<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#000000">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="format-detection"
        content="telephone=no"

    <!-- Keep this misleading -->
    <title>Flower Care</title>

    <link rel="stylesheet" href="style.css">

<body>

    <main id="app">

        <!-- =========================
             TERMINAL SCREEN
        ========================== -->

        <section
            id="terminal-screen"
            class="screen active"
        >

            <div
                id="terminal"
                class="terminal"
                aria-live="polite"
                aria-atomic="false"
            ></div>

        </section>


        <!-- =========================
             ROMANTIC SCREEN
             Later version
        ========================== -->

        <section
            id="romantic-screen"
            class="screen"
        ></section>


        <!-- =========================
             FINAL QUESTION SCREEN
             Later version
        ========================== -->

        <section
            id="question-screen"
            class="screen"
        ></section>


        <!-- =========================
             SUCCESS SCREEN
             Later version
        ========================== -->

        <section
            id="success-screen"
            class="screen"
        ></section>

    </main>


    <script src="js/phase3-connection.js"></script>
<script src="js/phase4-compatibility.js"></script>
<script src="js/phase5-relationship.js"></script>
<script src="js/phase6-romantic.js"></script>
